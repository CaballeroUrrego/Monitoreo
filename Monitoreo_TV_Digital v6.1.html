let fileHandle = null;

// 🔹 GUARDAR COMO (elige archivo)
async function guardarComo(){

  try{

    const opciones = {
      types: [{
        description: 'Archivo JSON',
        accept: {'application/json': ['.json']}
      }]
    };

    fileHandle = await window.showSaveFilePicker(opciones);

    alert("✅ Archivo creado correctamente");

  }catch(err){
    console.log(err);
  }
  guardarLocal(); // 🔥 asegura que lo último esté guardado
  await escribirArchivo();
}

// 🔹 GUARDAR (sobrescribe el mismo archivo)
async function guardarArchivo(){

  if(!fileHandle){
    alert("⚠️ Primero usa 'Guardar como'");
    return;
  }

  await escribirArchivo();

  alert("✅ Archivo actualizado");
  guardarLocal(); // 🔥 asegura que lo último esté guardado
}

// 🔹 FUNCIÓN CENTRAL (NO TOCAR)
async function escribirArchivo(){

  let db = JSON.parse(localStorage.getItem("monitoreoTV") || "{}");
let comentarios = JSON.parse(localStorage.getItem("comentariosTV") || "[]");
let novedades = JSON.parse(localStorage.getItem("novedadesTemp") || "{}");

  let contenido = {
    monitoreoTV: db,
    comentarios,
    novedades,
    canales
  };

  const writable = await fileHandle.createWritable();
  await writable.write(JSON.stringify(contenido, null, 2));
  await writable.close();
}

/* ================= GUARDAR ================= */
function guardarLocal(){

  let datos={};
  let novedadesTemp = JSON.parse(localStorage.getItem("novedadesTemp") || "{}");

  canales.forEach(c=>{
    let id=c.replace(/[^a-zA-Z0-9]/g,"");

    datos[id]={

  video:document.getElementById(id+"-video").value,
  audioPri:document.getElementById(id+"-audioPri").value,
  audioSec:document.getElementById(id+"-audioSec").value,
  logo:document.getElementById(id+"-logo").value,
  epg:document.getElementById(id+"-epg").value,
  novedad: novedadesTemp[id] || ""
};
  });

  // 🔥 OBTENER COMENTARIOS ACTUALES
let comentarios = JSON.parse(localStorage.getItem("comentariosTV")) || [];

db[stb]={
  meta:{
    analista:document.getElementById("analista").value,
    turno:document.getElementById("turno").value,
    stb:stb,
    fecha:new Date().toLocaleString()
  },
  datos,
  comentarios   // 🔥 NUEVO
};

  localStorage.setItem("monitoreoTV",JSON.stringify(db));
  alert("✅ Guardado por STB");
}

/* ================= LIMPIAR ================= */
function limpiarVista(){

  document.querySelectorAll("select").forEach(s=>s.selectedIndex=0);
  document.getElementById("analista").value="";
  document.getElementById("turno").value="";

  document.querySelectorAll(".card").forEach(c=>{
    c.classList.remove("ok","fail","warn");
  });

  actualizarPanel();
}

function resetTotal(){

  if(!confirm("⚠️ Se borrará todo el sistema")) return;

  localStorage.clear();
  location.reload();
}

/* ================= CARGAR ================= */
function cargarDatos(){

  let stb = document.getElementById("stb").value;
  let db = JSON.parse(localStorage.getItem("monitoreoTV") || "{}");

  if(!db[stb]) return;

  let data = db[stb];

  // Cargar datos generales
  document.getElementById("analista").value = data.meta.analista || "";
  document.getElementById("turno").value = data.meta.turno || "";

  let novedadesTemp = {};

  Object.values(data.datos).forEach(d => {

    let id = d.canal.replace(/[^a-zA-Z0-9]/g,"");

    if(document.getElementById(id+"-video")){

      document.getElementById(id+"-video").value = d.video || "V OK";
      document.getElementById(id+"-audioPri").value = d.audioPri || "A1 OK";
      document.getElementById(id+"-audioSec").value = d.audioSec || "A2 OK";
      document.getElementById(id+"-logo").value = d.logo || "L OK";
      document.getElementById(id+"-epg").value = d.epg || "E OK";

      document.getElementById(id+"-novedad").value = d.novedad || "";

      // Restaurar novedades
      novedadesTemp[id] = d.novedad || "";

      actualizar(id);
    }

  });

  // Guardar nuevamente en memoria temporal
  localStorage.setItem("novedadesTemp", JSON.stringify(novedadesTemp));

  actualizarPanel();
}
document.getElementById("stb").addEventListener("change",render);

function todoOK(id){
  document.getElementById(id+"-video").value="V OK";
  document.getElementById(id+"-audioPri").value="A1 OK";
  document.getElementById(id+"-audioSec").value="A2 OK";
  document.getElementById(id+"-logo").value="L OK";
  document.getElementById(id+"-epg").value="E OK";

function guardarNovedad(id, texto){
  let temp = JSON.parse(localStorage.getItem("novedadesTemp")) || {};
  temp[id] = texto;
  localStorage.setItem("novedadesTemp", JSON.stringify(temp));
}

/* ================= EXPORT ================= */
function exportarDatos(){
  let data=localStorage.getItem("monitoreoTV");
  if(!data) return alert("No hay datos");

  let blob=new Blob([data]);
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="monitoreo.json";
  a.click();
}

function importar(){
  let input=document.getElementById("fileInput");
  input.click();

  input.onchange=e=>{
    let reader=new FileReader();
    reader.onload=e=>{
      localStorage.setItem("monitoreoTV",e.target.result);
      location.reload();
    };
    reader.readAsText(e.target.files[0]);
  }
}

function exportarExcel(){

  let db=JSON.parse(localStorage.getItem("monitoreoTV"));
  if(!db) return;

  let csv="STB,Canal,Video,A1,A2,Logo,EPG,Novedad,Estado,Analista,Turno\n";

  Object.values(db).forEach(stb=>{

    canales.forEach(c=>{

      let id=c.replace(/[^a-zA-Z0-9]/g,"");
      let d = stb.datos[id] || {};

      let video = d.video || "SIN REVISAR";
      let a1 = d.audioPri || "SIN REVISAR";
      let a2 = d.audioSec || "SIN REVISAR";
      let logo = d.logo || "SIN REVISAR";
      let epg = d.epg || "SIN REVISAR";
      let novedad = d.novedad || "";

      let estado = "OK";
      if([video,a1,a2,logo,epg].some(v=>v.includes("FAIL"))) estado="FALLA";
      else if([video,a1,a2,logo,epg].some(v=>v.includes("SIN"))) estado="SIN REVISAR";

      csv+=`${stb.meta.stb},${c},${video},${a1},${a2},${logo},${epg},${novedad},${estado},${stb.meta.analista},${stb.meta.turno}\n`;

    });

  });

  let blob=new Blob([csv]);
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="reporte_completo.csv";
  a.click();
}
// ================= COMENTARIOS =================

function obtenerComentarios(){
  return JSON.parse(localStorage.getItem("comentariosTV")) || [];
}

function guardarComentarios(lista){
  localStorage.setItem("comentariosTV", JSON.stringify(lista));
}

function agregarComentario(){

  let texto = document.getElementById("comentarioInput").value.trim();
  if(!texto) return;

  let lista = obtenerComentarios();

  lista.push({
    texto,
    fecha: new Date().toLocaleString()
  });

  guardarComentarios(lista);

  document.getElementById("comentarioInput").value = "";

  renderComentarios();
}

function limpiarComentarios(){
  if(!confirm("¿Eliminar todos los comentarios?")) return;
  localStorage.removeItem("comentariosTV");
  renderComentarios();
}

function renderComentarios(){

  let lista = obtenerComentarios();

  let html = "<b>Histórico:</b><br>";

  lista.forEach(c=>{
    html += `• ${c.texto} <small>(${c.fecha})</small><br>`;
  });

  document.getElementById("listaComentarios").innerHTML = html;
}

// cargar al inicio
renderComentarios();

/* ================= NOC ================= */
function actualizar(id){

  let card=document.getElementById(id+"-video").closest(".card");

  let vals=[
    document.getElementById(id+"-video").value,
    document.getElementById(id+"-audioPri").value,
    document.getElementById(id+"-audioSec").value,
    document.getElementById(id+"-logo").value,
    document.getElementById(id+"-epg").value
  ];

  card.classList.remove("ok","fail","warn");

  if(vals.some(v=>v.includes("FAIL"))) card.classList.add("fail");
  else if(vals.some(v=>v.includes("N/A"))) card.classList.add("warn");
  else card.classList.add("ok");

  actualizarPanel();
}

function actualizarPanel(){
  let total=document.querySelectorAll(".card").length;
  let fallas=document.querySelectorAll(".fail").length;
  let salud=Math.round(((total-fallas)/total)*100);

  document.getElementById("total").innerText=total;
  document.getElementById("fallas").innerText=fallas;
  document.getElementById("salud").innerText=salud+"%";
}

/* ================= PDF ================= */

async function generarPDF(){

  let db = JSON.parse(localStorage.getItem("monitoreoTV"));
  if(!db){
    alert("No hay datos");
    return;
  }

  const pdfDiv = document.getElementById("pdfContent");

  let totalGlobal=0, okGlobal=0, failGlobal=0;
  let v=0,a=0,l=0,e=0;

  let tablaSTB="";
  let tablaCanales="";
  let listaNovedades = [];

  Object.values(db).forEach(stb=>{

    let total=0, ok=0, fail=0;

    Object.values(stb.datos).forEach(d=>{
      total++;
      totalGlobal++;

      let fallo=false;
      let tipo="";

      if(d.video.includes("FAIL")){v++; fallo=true; tipo+="Video ";}
      if(d.audioPri.includes("FAIL") || d.audioSec.includes("FAIL")){a++; fallo=true; tipo+="Audio ";}
      if(d.logo.includes("FAIL")){l++; fallo=true; tipo+="Logo ";}
      if(d.epg.includes("FAIL")){e++; fallo=true; tipo+="EPG ";}

      // 🔥 CAPTURAR NOVEDADES
      if(d.novedad && d.novedad.trim() !== ""){
        listaNovedades.push(`• ${d.canal}: ${d.novedad}`);
      }

      if(fallo){
        fail++; failGlobal++;

        tablaCanales+=`
        <tr>
          <td>${stb.meta.stb}</td>
          <td>${d.canal}</td>
          <td>${tipo}</td>
          <td>${d.novedad || 'N/A'}</td>
        </tr>`;
      }else{
        ok++; okGlobal++;
      }
    });

    let salud = ((ok/total)*100).toFixed(2);

    tablaSTB+=`
    <tr>
      <td>${stb.meta.stb}</td>
      <td>${total}</td>
      <td>${ok}</td>
      <td>${fail}</td>
      <td>${salud}%</td>
    </tr>`;
  });

  let saludGlobal = ((okGlobal/totalGlobal)*100).toFixed(2);

  // 🔥 ESTADO GENERAL
  let estadoGeneral = failGlobal === 0 ? "TODO OK ✅" : "CON FALLAS ⚠️";

  // 🔥 BLOQUE NOVEDADES
  let novedadesHTML = listaNovedades.length > 0
    ? listaNovedades.join("<br>")
    : "Sin novedades reportadas";

  // 🔥 COMENTARIOS
  let comentarios = obtenerComentarios();
  let bloqueComentarios = comentarios.map(c => `- ${c.texto}`).join("<br>");

  // 🔥 CONCLUSIÓN MEJORADA
  let conclusion = `
Durante el monitoreo se evaluaron ${totalGlobal} canales.<br>
Estado general: <b>${estadoGeneral}</b><br><br>

El ${saludGlobal}% se encuentra en estado OK.<br>
Se identificaron ${failGlobal} fallas.<br><br>

<b>Principales afectaciones:</b><br>
${v>0?'• Video<br>':''}
${a>0?'• Audio<br>':''}
${l>0?'• Logo<br>':''}
${e>0?'• EPG<br>':''}

<br>
<b>📌 Novedades detectadas:</b><br>
${novedadesHTML}

<br><br>
<b>📝 Observaciones del turno:</b><br>
${bloqueComentarios || "Sin comentarios"}
`;

  // 🔥 HTML DEL PDF
  pdfDiv.innerHTML = `
<div style="font-family:Segoe UI;background:#f3f4f6;padding:20px;color:#111">

<table width="100%" style="background:#b91c1c;color:white;border-radius:10px">
<tr>
<td style="padding:15px">
<h2>📊 Informe Ejecutivo Monitoreo TV</h2>
Fecha: ${new Date().toLocaleString()}<br>
<b>${estadoGeneral}</b>
</td>
</tr>
</table>

<br>

<table width="100%" border="0" style="text-align:center">
<tr>

<td style="background:white;padding:15px;border-radius:10px">
<b>Total Canales</b><br>
<h2>${totalGlobal}</h2>
</td>

<td style="background:white;padding:15px;border-radius:10px;color:green">
<b>OK</b><br>
<h2>${okGlobal}</h2>
${saludGlobal}%
</td>

<td style="background:white;padding:15px;border-radius:10px;color:red">
<b>Fallas</b><br>
<h2>${failGlobal}</h2>
</td>

<td style="background:white;padding:15px;border-radius:10px">
<b>Salud</b><br>
<h2>${saludGlobal}%</h2>
</td>

</tr>
</table>

<br>

<table width="100%" border="1" style="border-collapse:collapse;text-align:center;background:white">
<tr style="background:#b91c1c;color:white">
<th>STB</th><th>Total</th><th>OK</th><th>Fallas</th><th>% Salud</th>
</tr>
${tablaSTB}
</table>

<br>

<table width="100%" border="1" style="border-collapse:collapse;background:white;font-size:11px">
<tr style="background:#b91c1c;color:white">
<th>STB</th><th>Canal</th><th>Tipo Falla</th><th>Novedad</th>
</tr>
${tablaCanales}
</table>

<br>

<table width="100%" style="background:white;padding:15px;border-radius:10px">
<tr><td>

<h3>🧠 Conclusión</h3>

<div style="font-size:13px;line-height:1.6;">
${conclusion}
</div>

</td></tr>
</table>

</div>
`;

  pdfDiv.style.display="block";

  await html2pdf()
    .set({
      margin:10,
      filename:"Informe_Ejecutivo.pdf",
      html2canvas:{scale:2},
      jsPDF:{orientation:'portrait'}
    })
    .from(pdfDiv)
    .save();

  pdfDiv.style.display="none";
}

/* COPIAR CONCLUSIÓN */
function copiarConclusion(){
  let text = document.getElementById("conclusionBox");
  text.select();
  document.execCommand("copy");
  alert("Conclusión copiada");
}

</script>

</body>
</html>
